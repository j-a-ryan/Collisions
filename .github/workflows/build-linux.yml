name: Build Linux Executable

# on:
#   push:
#     branches: [ main ]          # or whatever your default branch is
#   workflow_dispatch:            # lets you trigger manually from GitHub UI
on:
  workflow_dispatch: # manual execution from the UI
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04    # x86_64 — built on glibc 2.35 for wider distro compatibility
            arch: x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.14'

      - name: Install system libraries for Qt
        run: |
          # PyInstaller imports PySide6 during analysis, so the Qt shared
          # libraries must be resolvable on the runner even though the GUI
          # never opens here.
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyqtdarktheme2's metadata declares Requires-Python <3.14, though it installs
          # and runs fine on 3.14 (pure-Python wheel) — see requirements.txt comment.
          if [ -f requirements.txt ]; then pip install --ignore-requires-python -r requirements.txt; fi
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          # Choose ONE of these options:

          # Option 1: Simple one-file executable (recommended for most apps)
          pyinstaller --onefile --windowed --add-data "resources:resources" main.py
          # pyinstaller --onefile --windowed main.py
          # (remove --windowed if it's a console app)

          # Option 2: Use your existing .spec file (best for complex apps)
          # pyinstaller myapp.spec

      - name: Upload Linux build
        uses: actions/upload-artifact@v4.6.0
        with:
          name: collisions-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
