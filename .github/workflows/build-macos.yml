name: Build macOS Executable

on:
  push:
    branches: [ main ]          # or whatever your default branch is
  workflow_dispatch:            # lets you trigger manually from GitHub UI

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-13    # Intel
            arch: x86_64
          - os: macos-14    # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # ← change to your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          # Choose ONE of these options:

          # Option 1: Simple one-file executable (recommended for most apps)
          pyinstaller --onefile --windowed main.py
          # pyinstaller --onefile --windowed main.py
          # (remove --windowed if it's a console app)

          # Option 2: Use your existing .spec file (best for complex apps)
          # pyinstaller myapp.spec

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/