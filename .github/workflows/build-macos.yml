name: Build macOS Executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to upload the builds to'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow the workflow to upload assets to an existing Release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15-intel    # Intel
            arch: x86_64
          - os: macos-14         # Apple Silicon
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyqtdarktheme2's metadata declares Requires-Python <3.14,
          # though it installs and runs fine on 3.14 (pure-Python wheel).
          if [ -f requirements.txt ]; then pip install --ignore-requires-python -r requirements.txt; fi
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --add-data "resources:resources" main.py

      - name: Rename build for release
        run: |
          mv dist/main "dist/collisions-macos-${{ matrix.arch }}"

      - name: Upload to GitHub Release
        run: |
          gh release upload \
            "${{ inputs.release_tag }}" \
            "dist/collisions-macos-${{ matrix.arch }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
